{# A single authored page: content/pages/<slug>.md. #}
{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ site.title }}{% endblock %}

{% block content %}
<article>
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="post-content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock %}
