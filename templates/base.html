<!doctype html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Baloo+2:wght@500;700&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="wrap">
    <header class="site-header">
      <div class="site-header-content">
        <a class="site-title" href="/">{{ site.title }}</a>
        <p class="site-tagline">{{ site.description }}</p>
        <nav class="site-nav">
            <a href="/">Katedry</a>
            <a href="/staff/">Personál</a>
            <a href="/about/">O univerzitě</a>
        </nav>
      </div>
      {% include "_theme-toggle.html" %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ current_year }} {{ site.title }}, Ústav informatiky</p>
    </footer>
  </div>
</body>
</html>
